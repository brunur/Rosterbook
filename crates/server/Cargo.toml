[package]
name = "alt-ledger-server"
description = "Local network server for RosterBook: serves the UI and your character data to this PC and paired devices."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "alt-ledger-server"
path = "src/main.rs"

[dependencies]
alt-ledger-core = { path = "../core" }
alt-ledger-casc = { path = "../casc" }
anyhow = "1.0.104"
axum = "0.8.9"
futures-util = "0.3.34"
getrandom = "0.4.3"
hex = "0.4.3"
if-addrs = "0.15.0"
mime_guess = "2.0.5"
notify = "8.2.0"
qrcode = "0.14.1"
rust-embed = "8.13.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tokio = { version = "1.54.0", features = ["rt-multi-thread", "macros", "sync", "time", "net", "signal", "fs"] }
tokio-stream = { version = "0.1.19", features = ["sync"] }

[dev-dependencies]
alt-ledger-casc = { path = "../casc", features = ["testing"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json"] }
tempfile = "3.27.0"

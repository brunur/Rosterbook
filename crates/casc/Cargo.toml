[package]
name = "alt-ledger-casc"
description = "Read-only access to item icons in a local World of Warcraft install (CASC storage, BLP images)."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
# Helpers that build fake installs, for tests in other crates.
testing = []

[dependencies]
flate2 = "1.1.10"
md-5 = "0.11.0"
png = "0.18.1"
thiserror = "2"

[dev-dependencies]
tempfile = "3.27.0"

[[example]]
name = "dev_install"
required-features = ["testing"]
